<text x="614" y="1052" font-size="14" fill="#e2e8f0" font-family="Microsoft YaHei, Segoe UI, sans-serif">calculateBusPumping  母线泵升</text>
<text x="614" y="1073" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  V_peak = √(V0² + 2·η·Ek/C)</text>
<text x="614" y="1094" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  （含线束电感储能 0.5·L·I²）</text>
<text x="614" y="1115" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif"></text>
<text x="614" y="1136" font-size="14" fill="#e2e8f0" font-family="Microsoft YaHei, Segoe UI, sans-serif">checkMillerRisk  米勒直通</text>
<text x="614" y="1157" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  阻性界 Im·Rg</text>
<text x="614" y="1178" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  + 容性分压界 Cgd/(Cgd+Cgs)·Vbus</text>
<text x="614" y="1199" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  + 源极电感过冲 L·di/dt</text>
<text x="614" y="1220" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  → 两界取小 + 实测尖峰优先</text>
<text x="614" y="1241" font-size="14" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif">  （已由 P003 提升而来 · 向后兼容）</text>
