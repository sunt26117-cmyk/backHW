name: CI

# 质量门禁：任何 push / PR 都必须通过 lint + 全量模式断言 + 离线单文件构建，
# 防止"测试范围被调小掩盖已知问题"这类情况在合并前被悄悄绕过。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Run deterministic-engine + pattern regression (P001-P018 + J001-J007)
        run: npm test

      - name: Build offline single-file bundle
        run: npm run build
